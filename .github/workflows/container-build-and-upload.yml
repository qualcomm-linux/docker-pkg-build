name: Container Build And Upload
description: |
  Builds and uploads to GHCR (GitHub Container Registry) the container used to build the Qualcomm debian packages.
  Builds natively on an arm64 self-hosted runner. Images are uploaded on push to main, scheduled runs, and manual dispatches.

on:
  schedule:
    # Runs at 00:00 UTC every Monday
    - cron: '0 0 * * 1'

  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  QCOM_ORG_NAME: "qualcomm-linux"

  IMAGE_NAME: "pkg-builder"

jobs:

  # Build the arm64 natively using a self-hosted runner on an arm64 host
  # Cross compiling the image using buildx on an x86_64 host was tried but failed due to
  # issues with qemu and multiarch support in docker buildx.
  build-deb-arm64:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Debian Images
        shell: bash
        run: |
          set -euo pipefail
          sid_failed_marker="${RUNNER_TEMP}/sid-build-failed"

          # Fresh marker for this job run
          rm -f "${sid_failed_marker}"

          for distro in noble resolute trixie forky sid; do
            echo "Building image '${distro}'"
            if [[ "${distro}" == "sid" ]]; then
              if ! ./docker_deb_build.py --rebuild --distro "${distro}" --no-update-check; then
                echo "sid build failed; continuing without sid."
                touch "${sid_failed_marker}"
              fi
            else
              ./docker_deb_build.py --rebuild --distro "${distro}" --no-update-check
            fi
          done

      - name: Validate Debian Images Using local dummy package
        shell: bash
        run: |
          set -euo pipefail
          sid_failed_marker="${RUNNER_TEMP}/sid-build-failed"

          source_dir="${GITHUB_WORKSPACE}/.github/dummy-package"
          output_root="${GITHUB_WORKSPACE}/build/dummy-package"

          for distro in noble resolute trixie forky sid; do
            if [[ "${distro}" == "sid" && -f "${sid_failed_marker}" ]]; then
              echo "Skipping sid validation because sid image build failed."
              continue
            fi

            output_dir="${output_root}/${distro}"
            mkdir -p "${output_dir}"
            echo "Testing image '${distro}' with docker_deb_build.py"
            if [[ "${distro}" == "sid" ]]; then
              if ! ./docker_deb_build.py \
                --source-dir "${source_dir}" \
                --output-dir "${output_dir}" \
                --distro "${distro}" \
                --no-update-check; then
                echo "sid validation failed; continuing without sid."
                touch "${sid_failed_marker}"
              fi
            else
              ./docker_deb_build.py \
                --source-dir "${source_dir}" \
                --output-dir "${output_dir}" \
                --distro "${distro}" \
                --no-update-check
            fi
          done

      - name: Log in to GHCR
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Debian Images
        # Only upload on trusted events that land code on main
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          sid_failed_marker="${RUNNER_TEMP}/sid-build-failed"

          # UBUNTU IMAGES
          docker push ghcr.io/${{env.QCOM_ORG_NAME}}/${{env.IMAGE_NAME}}:noble
          docker push ghcr.io/${{env.QCOM_ORG_NAME}}/${{env.IMAGE_NAME}}:resolute

          # DEBIAN IMAGES
          docker push ghcr.io/${{env.QCOM_ORG_NAME}}/${{env.IMAGE_NAME}}:trixie
          docker push ghcr.io/${{env.QCOM_ORG_NAME}}/${{env.IMAGE_NAME}}:forky
          if [[ -f "${sid_failed_marker}" ]]; then
            echo "Skipping sid push because sid build/validation failed."
          else
            docker push ghcr.io/${{env.QCOM_ORG_NAME}}/${{env.IMAGE_NAME}}:sid
          fi

  build-rpm-arm64:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build RPM Images
        run: ./docker_rpm_build.py --rebuild --no-update-check

      - name: Log in to GHCR
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Show matching images
        shell: bash
        run: |
          docker image ls --format '{{.Repository}}:{{.Tag}}' \
            | grep -E "^ghcr.io/${{ env.QCOM_ORG_NAME }}/${{ env.IMAGE_NAME }}:(fedora|rhel|redhat|centos)\..*$" || true

      - name: Upload RPM Images
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          docker image ls --format '{{.Repository}}:{{.Tag}}' \
            | grep -E "^ghcr.io/${{ env.QCOM_ORG_NAME }}/${{ env.IMAGE_NAME }}:(fedora|rhel|redhat|centos)\..*$" \
            | while read -r image; do
                echo "Pushing $image"
                docker push "$image"
              done
